<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a1628">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Turnos">
<title>Mis Turnos Médicos</title>
<style>
:root{color-scheme:dark;--bg:#0a1628;--card:#11233d;--c2:#162d4d;--ink:#eef4fa;--mu:#9db0c6;--ln:#23406a;--ac:#2dd4bf;--ai:#04201c;--bad:#ff8a80;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px calc(150px + env(safe-area-inset-bottom,0px))}
.warn{background:#4a2a12;color:#ffd9b0;padding:10px 14px;font-size:.9rem}
.mrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mrow div{flex:1;text-align:center;font-weight:600;font-size:1.1rem;text-transform:capitalize}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer}
.nb{width:48px;height:48px;border-radius:12px;border:1px solid var(--ln);background:var(--card);font-size:1.4rem}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px}
.tile.big{grid-column:1/-1;background:linear-gradient(135deg,#0f3b4d,#11233d);border-color:var(--ac)}
.l{color:var(--mu);font-size:.82rem}.v{font-size:1.35rem;font-weight:650;font-variant-numeric:tabular-nums}.big .v{font-size:2rem;color:var(--ac)}.s{color:var(--mu);font-size:.82rem}
h2{font-size:1rem;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
dl{margin:0}dl div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--ln)}dl div:first-child{border-top:0}dt{color:var(--mu)}dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}
.row{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:8px}
.ra{grid-column:1/-1;display:flex;gap:8px}.rr{text-align:right}
.sm{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--ln);background:var(--c2)}
.bad{color:var(--bad)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.cal span{text-align:center;color:var(--mu);font-size:.78rem}
.day{min-height:48px;border-radius:10px;border:1px solid var(--ln);background:var(--card);padding:2px}
.day.has{border-color:var(--ac)}.day.sel{background:var(--ac);color:var(--ai);font-weight:700}.day.td{box-shadow:inset 0 0 0 2px #fff}
.day i{display:block;font-style:normal;font-size:.7rem;color:var(--ac)}.day.sel i{color:var(--ai)}
.pri{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--ac);color:var(--ai);font-weight:700;font-size:1.05rem}
.sec{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--ln);background:var(--c2);margin-top:8px}
label{display:block;font-size:.88rem;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;min-height:48px;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{min-height:90px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:.92rem;margin-top:10px;min-height:1.2em}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0d1d34;border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;min-height:50px;border:0;background:none;color:var(--mu);font-size:.85rem;border-radius:10px}
.nav button.on{color:var(--ac);font-weight:700;background:var(--card)}
#fab{position:fixed;right:14px;bottom:calc(72px + env(safe-area-inset-bottom,0px));min-height:52px;padding:0 20px;border:0;border-radius:26px;background:var(--ac);color:var(--ai);font-weight:700;box-shadow:0 4px 14px #0008}
#sheet{position:fixed;inset:0;z-index:5;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
#sheet .wrap{padding-top:calc(14px + env(safe-area-inset-top,0px))}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:#0f3b4d;border:1px solid var(--ac);padding:12px 18px;border-radius:12px;z-index:9;max-width:90%;text-align:center}
.mu{color:var(--mu);font-size:.85rem}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:12px;border:1px solid var(--ln);border-radius:12px}
.tw table{width:100%;border-collapse:collapse;font-size:.82rem;font-variant-numeric:tabular-nums}
.tw th,.tw td{padding:7px 8px;border-top:1px solid var(--ln);text-align:left;white-space:nowrap;vertical-align:middle}
.tw th{color:var(--mu);font-weight:500;border-top:0;background:var(--card)}
.tw td.n,.tw th.n{text-align:right}
.tw input{min-height:40px;padding:6px 8px;width:auto;min-width:92px}
.tw input.inv{border-color:var(--bad)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:middle}
.dot.g{background:#34d399}.dot.y{background:#fbbf24}.dot.r{background:var(--bad)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 10px;color:var(--mu);font-size:.8rem}
.cx{background:none;border:1px solid var(--ln);border-radius:8px;min-height:40px;min-width:40px;color:var(--bad)}
.fl{display:flex;gap:8px;flex-wrap:wrap}.fl .sec{flex:1;min-width:140px}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<div class="warn" id="warn" hidden></div>
<div class="wrap">
<div class="mrow"><button class="nb" id="prev" type="button" aria-label="Mes anterior">‹</button><div id="ml"></div><button class="nb" id="next" type="button" aria-label="Mes siguiente">›</button></div>
<section id="v-panel"></section>
<section id="v-cal" hidden></section>
<section id="v-list" hidden></section>
<section id="v-cmp" hidden></section>
<section id="v-set" hidden></section>
</div>
<button id="fab" type="button">+ Nuevo turno</button>
<nav class="nav" id="nav"><button type="button" data-v="panel" class="on">Panel</button><button type="button" data-v="cal">Calendario</button><button type="button" data-v="list">Turnos</button><button type="button" data-v="cmp">Comparar</button><button type="button" data-v="set">Ajustes</button></nav>

<div id="sheet" hidden><div class="wrap">
<h2 id="st" style="font-size:1.3rem">Nuevo turno</h2>
<label for="f-fecha">Fecha</label><input id="f-fecha" type="date">
<div class="two"><div><label for="f-ini">Hora de inicio</label><input id="f-ini" type="time"></div><div><label for="f-fin">Hora de término</label><input id="f-fin" type="time"></div></div>
<div class="two"><div><label for="f-tipo">Tipo de turno</label><select id="f-tipo"><option value="diurno">Diurno</option><option value="nocturno">Nocturno</option><option value="extraordinario">Extraordinario</option></select></div>
<div><label for="f-mod">Modalidad</label><select id="f-mod"><option value="honorarios">Boleta de honorarios</option><option value="contrato">Contrato</option></select></div></div>
<label for="f-lugar">Lugar de trabajo</label><input id="f-lugar" type="text" autocomplete="off">
<div class="two"><div><label for="f-pago">Pago</label><select id="f-pago"><option value="hora">Valor por hora</option><option value="fijo">Monto fijo del turno</option></select></div>
<div><label for="f-valor">Valor (CLP)</label><input id="f-valor" type="number" inputmode="decimal" min="0" step="any"></div></div>
<label for="f-obs">Observaciones (opcional)</label><textarea id="f-obs"></textarea>
<div class="card" style="margin-top:12px" id="f-info">Completa horario y valor para ver el cálculo.</div>
<div class="err" id="f-err" role="alert"></div>
<button class="pri" id="f-save" type="button">Guardar turno</button>
<button class="sec" id="f-cancel" type="button">Cancelar</button>
</div></div>
<div id="toast" hidden role="status"></div>

<script>
(function(){
"use strict";
var KEY="mtm_v1",$=function(i){return document.getElementById(i)},p2=function(n){return n<10?"0"+n:""+n};
var db={turnos:[],cfg:{base:0,prev:0,salud:0,imp:0,otros:0,ret:{},last:{}}},store=true,pend=null,editId=null,sel=null,view="panel",tt;
var DR={2024:13.75,2025:14.5,2026:15.25,2027:16,2028:17},TD={diurno:["08:00","20:00"],nocturno:["20:00","08:00"],extraordinario:["08:00","17:00"]};
var now=new Date(),ym=now.getFullYear()+"-"+p2(now.getMonth()+1),today=ym+"-"+p2(now.getDate());
var nf=new Intl.NumberFormat("es-CL",{style:"currency",currency:"CLP",maximumFractionDigits:0});
var money=function(v){return nf.format(Math.round(v||0))},fh=function(h){return (Math.round(h*10)/10+"").replace(".",",")+" h"};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var cap=function(s){return s.charAt(0).toUpperCase()+s.slice(1)};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)};
var v=function(i){return $(i).value};

/* ---------- Almacenamiento ---------- */
function warn(m){$("warn").textContent=m;$("warn").hidden=!m}
function probe(){try{localStorage.setItem("mtm_t","1");var o=localStorage.getItem("mtm_t")==="1";localStorage.removeItem("mtm_t");return o}catch(e){return false}}
function load(){
  store=probe();
  if(!store){warn("Tu navegador bloquea el almacenamiento: los turnos se perderán al cerrar. Exporta un respaldo en Ajustes.");return}
  try{var s=localStorage.getItem(KEY);if(s){var d=JSON.parse(s);if(d&&Array.isArray(d.turnos)){db.turnos=d.turnos;db.cfg=Object.assign(db.cfg,d.cfg||{})}}}
  catch(e){try{localStorage.setItem(KEY+"_corrupto",localStorage.getItem(KEY))}catch(x){}warn("Los datos guardados estaban dañados. Se conservó una copia aparte; puedes importar un respaldo en Ajustes.")}
}
function persist(){if(!store)return "mem";var s=JSON.stringify(db);try{localStorage.setItem(KEY,s);return localStorage.getItem(KEY)===s}catch(e){return false}}

/* ---------- Cálculos ---------- */
function mins(a,b){var x=a.split(":"),y=b.split(":"),m=(+y[0]*60+ +y[1])-(+x[0]*60+ +x[1]);if(m<=0)m+=1440;return m}
function monto(t){return t.pago==="fijo"?t.valor:mins(t.ini,t.fin)/60*t.valor}
function retPct(y){var r=db.cfg.ret[y];return r!=null?r:(DR[y]!=null?DR[y]:(y>2028?17:13.75))}
function mes(){return db.turnos.filter(function(t){return t.f.slice(0,7)===ym}).sort(function(a,b){return (a.f+a.ini)<(b.f+b.ini)?-1:1})}
function calc(){
  var L=mes(),r={n:L.length,h:0,d:0,no:0,e:0,c:{b:0,n:0},o:{b:0,n:0}},c=db.cfg;
  L.forEach(function(t){r.h+=mins(t.ini,t.fin)/60;r[t.tipo==="diurno"?"d":t.tipo==="nocturno"?"no":"e"]++;var g=t.mod==="contrato"?r.c:r.o;g.b+=monto(t);g.n++});
  r.cb=(+c.base||0)+r.c.b;r.cd=r.cb>0?r.cb*((+c.prev||0)+(+c.salud||0)+(+c.imp||0))/100+(+c.otros||0):0;r.cl=r.cb-r.cd;
  r.rp=retPct(+ym.slice(0,4));r.ob=r.o.b;r.od=r.ob*r.rp/100;r.ol=r.ob-r.od;
  r.tb=r.cb+r.ob;r.tl=r.cl+r.ol;return r;
}

/* ---------- Validación ---------- */
function okDate(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");if(!m)return false;var d=new Date(+m[1],+m[2]-1,+m[3]);return d.getMonth()===+m[2]-1&&d.getDate()===+m[3]}
function okT(s){return /^([01]\d|2[0-3]):[0-5]\d$/.test(s||"")}
function valida(t){
  if(!okDate(t.f))return "Elige una fecha válida.";
  if(!okT(t.ini))return "Indica la hora de inicio.";
  if(!okT(t.fin))return "Indica la hora de término.";
  if(!TD[t.tipo])return "Elige el tipo de turno.";
  if(t.mod!=="contrato"&&t.mod!=="honorarios")return "Elige la modalidad.";
  if(!t.lugar)return "Escribe el lugar de trabajo.";
  if(t.pago!=="hora"&&t.pago!=="fijo")return "Elige cómo se paga el turno.";
  if(!(t.valor>0))return "Escribe un valor mayor a 0.";
  return "";
}
var dupe=function(t,a){return a.f===t.f&&a.ini===t.ini&&a.fin===t.fin&&a.mod===t.mod&&a.lugar===t.lugar&&a.id!==t.id};

/* ---------- Vistas ---------- */
function tile(l,val,s,c){return '<div class="tile'+(c?" "+c:"")+'"><div class="l">'+l+'</div><div class="v">'+val+'</div>'+(s?'<div class="s">'+s+'</div>':"")+'</div>'}
function fd(f){var p=f.split("-");return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("es-CL",{weekday:"short",day:"numeric",month:"short"})}
function row(t){
  var h=mins(t.ini,t.fin)/60;
  return '<div class="row"><div><b>'+fd(t.f)+'</b>, '+t.ini+' a '+t.fin+'<div class="s">'+cap(t.tipo)+', '+(t.mod==="contrato"?"Contrato":"Honorarios")+', '+esc(t.lugar)+'</div>'+(t.obs?'<div class="s">'+esc(t.obs)+'</div>':"")+'</div><div class="rr"><b>'+money(monto(t))+'</b><div class="s">'+fh(h)+'</div></div><div class="ra"><button type="button" class="sm" data-act="ed" data-id="'+t.id+'">Editar</button><button type="button" class="sm bad" data-act="del" data-id="'+t.id+'">'+(pend===t.id?"¿Seguro? Toca de nuevo":"Eliminar")+'</button></div></div>';
}
function rPanel(){
  var r=calc(),h='<div class="grid">'+tile("Líquido mensual estimado",money(r.tl),"Bruto total: "+money(r.tb),"big")+tile("Turnos",r.n)+tile("Horas trabajadas",fh(r.h))+tile("Diurnos",r.d)+tile("Nocturnos",r.no,r.e?r.e+" extraordinario(s)":"")+'</div>';
  h+='<div class="card"><b>Contrato</b><dl><div><dt>Sueldo base</dt><dd>'+money(db.cfg.base)+'</dd></div><div><dt>Turnos ('+r.c.n+')</dt><dd>'+money(r.c.b)+'</dd></div><div><dt>Bruto</dt><dd>'+money(r.cb)+'</dd></div><div><dt>Descuentos</dt><dd>-'+money(r.cd)+'</dd></div><div><dt>Líquido</dt><dd><b>'+money(r.cl)+'</b></dd></div></dl></div>';
  h+='<div class="card"><b>Honorarios</b><dl><div><dt>Turnos ('+r.o.n+'), bruto</dt><dd>'+money(r.ob)+'</dd></div><div><dt>Retención '+String(r.rp).replace(".",",")+'%</dt><dd>-'+money(r.od)+'</dd></div><div><dt>Líquido</dt><dd><b>'+money(r.ol)+'</b></dd></div></dl></div>';
  if(!db.cfg.base&&!db.cfg.prev&&!db.cfg.salud&&!db.cfg.imp&&!db.cfg.otros)h+='<p class="mu">Para contrato, configura sueldo base y descuentos en Ajustes.</p>';
  $("v-panel").innerHTML=h;
}
function rCal(){
  var y=+ym.slice(0,4),m=+ym.slice(5),off=(new Date(y,m-1,1).getDay()+6)%7,nd=new Date(y,m,0).getDate(),h='<div class="cal">'+["L","M","M","J","V","S","D"].map(function(x){return "<span>"+x+"</span>"}).join("");
  for(var i=0;i<off;i++)h+="<span></span>";
  for(var d=1;d<=nd;d++){var f=ym+"-"+p2(d),n=db.turnos.filter(function(t){return t.f===f}).length;h+='<button type="button" class="day'+(n?" has":"")+(sel===f?" sel":"")+(f===today?" td":"")+'" data-act="day" data-d="'+f+'">'+d+(n?"<i>"+n+(n>1?" turnos":" turno")+"</i>":"")+"</button>"}
  h+="</div>";
  if(sel&&sel.slice(0,7)===ym){var L=db.turnos.filter(function(t){return t.f===sel});h+="<h2>"+fd(sel)+"</h2>"+(L.length?L.map(row).join(""):'<p class="mu">Sin turnos este día.</p>')+'<button type="button" class="pri" data-act="addday">Agregar turno este día</button>'}
  else h+='<p class="mu">Toca un día para ver o agregar turnos.</p>';
  $("v-cal").innerHTML=h;
}
function rList(){var L=mes();$("v-list").innerHTML=L.length?L.map(row).join(""):'<p class="mu">Aún no hay turnos este mes. Usa "+ Nuevo turno".</p>'}
function rSet(){
  var c=db.cfg,y=+ym.slice(0,4),f=function(k){return '<input id="s-'+k+'" type="number" inputmode="decimal" min="0" step="any" value="'+(c[k]||"")+'" placeholder="0">'};
  $("v-set").innerHTML='<div class="card"><b>Contrato</b><label for="s-base">Sueldo base mensual (CLP)</label>'+f("base")+'<div class="two"><div><label for="s-prev">Previsión (%)</label>'+f("prev")+'</div><div><label for="s-salud">Salud (%)</label>'+f("salud")+'</div></div><div class="two"><div><label for="s-imp">Impuesto (%)</label>'+f("imp")+'</div><div><label for="s-otros">Otros desc. (CLP)</label>'+f("otros")+'</div></div></div>'+
  '<div class="card"><b>Honorarios</b><label for="s-ret">Retención año '+y+' (%)</label><input id="s-ret" type="number" inputmode="decimal" min="0" max="100" step="0.01" value="'+retPct(y)+'"><p class="mu">Valor inicial según el calendario vigente de la ley; confírmalo con el SII o tu contador.</p></div>'+
  '<button class="pri" type="button" data-act="cfg">Guardar ajustes</button><div class="err" id="s-msg" role="status"></div>'+
  '<div class="card" style="margin-top:14px"><b>Respaldo y exportación de datos</b><p class="mu" style="margin-bottom:0">Exportar documentos: PDF o Excel para consultar y presentar tus turnos.</p><label for="x-mode">Período</label><select id="x-mode"><option value="mes">Mes específico</option><option value="rango">Rango de fechas</option><option value="todo">Todos los registros</option></select>'+
  '<div id="x-mes"><label for="x-m">Mes</label><input id="x-m" type="month" value="'+ym+'"></div>'+
  '<div id="x-rg" class="two" hidden><div><label for="x-d1">Desde</label><input id="x-d1" type="date" value="'+ym+'-01"></div><div><label for="x-d2">Hasta</label><input id="x-d2" type="date" value="'+ym+'-'+p2(new Date(y,+ym.slice(5),0).getDate())+'"></div></div>'+
  '<button class="sec" type="button" data-act="x-pdf">Exportar PDF</button><button class="sec" type="button" data-act="x-xls">Exportar Excel</button><div class="err" id="x-msg" role="status"></div><div id="x-out"></div></div>'+
  '<div class="card"><b>Copia de seguridad</b><p class="mu">El respaldo (JSON) sirve para recuperar la app: incluye turnos, ajustes, tarifas y comparaciones. Exportar copia el respaldo al portapapeles; pégalo en Notas o un correo. Para restaurar, pégalo aquí abajo e importa, o carga el archivo.</p><textarea id="bk" aria-label="Respaldo JSON"></textarea><button class="sec" type="button" data-act="exp">Exportar respaldo</button><button class="sec" type="button" data-act="b-dl">Descargar respaldo como archivo</button><button class="sec" type="button" data-act="imp">Importar respaldo</button><button class="sec" type="button" data-act="b-file">Cargar respaldo desde archivo</button><input id="b-file" type="file" accept=".json,application/json,text/plain" hidden><div class="err" id="b-msg" role="status"></div><div id="b-out"></div></div>'+
  '<p class="mu">Almacenamiento: '+(store?"disponible en este navegador.":"bloqueado.")+' Safari puede borrar los datos de sitios que no abres por varios días: haz respaldos periódicos.</p>';
}
function render(){
  $("ml").textContent=new Date(+ym.slice(0,4),+ym.slice(5)-1,1).toLocaleDateString("es-CL",{month:"long",year:"numeric"});
  ["panel","cal","list","cmp","set"].forEach(function(k){$("v-"+k).hidden=view!==k});
  Array.prototype.forEach.call($("nav").children,function(b){b.className=b.getAttribute("data-v")===view?"on":""});
  $("fab").hidden=view==="set"||view==="cmp";
  ({panel:rPanel,cal:rCal,list:rList,cmp:rCmp,set:rSet})[view]();
}
function toast(m){var t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2600)}

/* ---------- Formulario ---------- */
function info(){
  var t={ini:v("f-ini"),fin:v("f-fin"),pago:v("f-pago"),valor:parseFloat(v("f-valor"))};
  $("f-info").textContent=okT(t.ini)&&okT(t.fin)?"Duración: "+fh(mins(t.ini,t.fin)/60)+(t.fin<=t.ini?" (termina al día siguiente)":"")+(t.valor>0?". Monto estimado: "+money(monto(t)):""):"Completa horario y valor para ver el cálculo.";
}
function openSheet(id,date){

/* --- OCR --- */
async function ocr(src){
  await need("tess");

  if(src&&src.toBlob){blob=await new Promise(function(ok){try{src.toBlob(function(b){ok(b)},"image/png")}catch(e){ok(null)}})}

    var r=await Tesseract.recognize(blob||src,"spa",{logger:function(m){if(m&&m.status==="recognizing text")cm("Leyendo la imagen… "+Math.round(m.progress*100)+"%")}});
    return r.data.text;
  }catch(e){
    throw mkErr("ocr","El lector de texto (OCR) no pudo procesar la imagen. La primera vez descarga el idioma español, así que necesita buena conexión; reintenta."+VH(),"OCR: "+(errTxt(e)||"sin detalle: el navegador no dejó iniciar el lector (workers bloqueados)"));
  }
}
async function ocrImg(cv){return ocr(cv)}

/* --- PDF --- */
async function readPdf(buf){
  var L=await pdfInit(),doc,grid=[],chars=0,p;
  try{doc=await L.getDocument({data:new Uint8Array(buf)}).promise}
  catch(e){var nm=e&&e.name;
    if(nm==="PasswordException")throw mkErr("file","El PDF está protegido con contraseña. Quita la protección o ingresa los datos manualmente.","PasswordException");
    if(nm==="InvalidPDFException"||nm==="FormatError")throw mkErr("file","El archivo no es un PDF válido o está dañado.",errTxt(e));
    throw mkErr("pdf","No se pudo abrir el PDF con el lector de PDF."+(/worker|blob/i.test(errTxt(e))?VH():""),errTxt(e));
  }
  try{
    for(p=1;p<=doc.numPages&&p<=30;p++){
      var pg=await doc.getPage(p),tc=await pg.getTextContent(),rows=[];
      tc.items.forEach(function(it){
        if(!it.str||!it.str.trim())return;chars+=it.str.length;
        var y=it.transform[5],x=it.transform[4],r=null;
        for(var k=0;k<rows.length;k++)if(Math.abs(rows[k].y-y)<=3){r=rows[k];break}
        if(!r){r={y:y,c:[]};rows.push(r)}r.c.push({x:x,w:it.width||0,s:it.str});
      });
      rows.sort(function(a,b){return b.y-a.y});
      rows.forEach(function(r){r.c.sort(function(a,b){return a.x-b.x});var cells=[],end=null;
        r.c.forEach(function(c){if(end!==null&&c.x-end<4)cells[cells.length-1]+=(c.x-end<1.5?"":" ")+c.s.trim();else cells.push(c.s.trim());end=c.x+c.w});
        grid.push(cells)});
    }
    if(chars<40){
      cm("El PDF parece escaneado. Leyendo con OCR…");

        var pg2=await doc.getPage(p),vp=pg2.getViewport({scale:2}),cv=document.createElement("canvas");cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
        await pg2.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
        grid=grid.concat(txt2grid(await ocrImg(cv)));
      }
    }
  }catch(e){if(e&&e.kind)throw e;throw mkErr("pdf","No se pudo leer el contenido del PDF.",errTxt(e))}
  return grid;
}
function cm(t){cmsg=t;var e=$("c-msg");if(e)e.textContent=t}
var imp=false;
async function leerEmp(file){
  if(imp){cm("Ya se está leyendo un documento. Espera a que termine.");return}
  imp=true;
  var n=(file.name||"").toLowerCase(),ty=(file.type||"").toLowerCase(),grid,src,buf,fmt;
  try{
    cm("Leyendo el archivo…");
    /* 1) Copiar los bytes a memoria ANTES de hacer cualquier otra cosa: en iPhone el archivo elegido puede dejar de ser válido */
    try{buf=await readBytes(file)}catch(e){throw mkErr("file","No se pudo leer el archivo seleccionado. En iPhone suele ocurrir si está en iCloud sin descargar o si se movió mientras se leía. Ábrelo primero en Archivos o Fotos para que se descargue y vuelve a elegirlo.","Lectura: "+errTxt(e)+" ("+(file.name||"sin nombre")+")")}
    if(!buf||!buf.byteLength)throw mkErr("file","El archivo está vacío o no se pudo descargar al teléfono. Ábrelo primero en Archivos o Fotos y vuelve a elegirlo.","0 bytes ("+(file.name||"sin nombre")+")");
    /* 2) Decidir por el contenido real; el nombre y el tipo solo si el contenido no se reconoce */
    fmt=sniff(buf);
    var route=fmt==="pdf"?"pdf":(fmt==="zip"||fmt==="ole")?"xls":IMT[fmt]?"img":/\.pdf$/.test(n)||ty==="application/pdf"?"pdf":/\.xlsx?$/.test(n)||/spreadsheet|excel/.test(ty)?"xls":/^image\//.test(ty)||/\.(jpe?g|png|heic|heif)$/.test(n)?"img":"";
    if(!route){cm("Formato no admitido ("+(file.name||"sin nombre")+"). Usa Excel (.xlsx), PDF, JPG o PNG, o ingresa los datos manualmente.");return}
    if(route==="xls"){
      src="Excel";
      try{grid=await readXlsx(buf)}catch(e){if(e&&e.kind)throw e;throw mkErr("file","No se pudo leer el Excel. Revisa que sea un .xlsx válido y sin contraseña.",errTxt(e))}
    }else if(route==="pdf"){grid=await readPdf(buf);src="PDF"}
    else{
      cm("Preparando la imagen…");

    }
    var r=interp(grid,+ym.slice(0,4));

    cm(r.rows.length?"Se reconocieron "+r.rows.length+" registro(s). Revísalos antes de confirmar."+(src.indexOf("OCR")>=0?" La lectura por OCR puede tener errores: revisa cada fila.":""):"No pude reconocer turnos en este documento. Puedes agregar los registros manualmente.");

  }finally{imp=false}

/* --- Datos guardados de comparaciones --- */
function nrow(e){
  if(!e||typeof e!=="object"||!okDate(e.f))return null;
  var n=function(x){x=x==null||x===""?null:+x;return x!=null&&isFinite(x)&&x>=0?x:null};
  return {id:String(e.id||uid()),f:e.f,ini:okT(e.ini)?e.ini:"",fin:okT(e.fin)?e.fin:"",rec:n(e.rec),des:n(e.des)||0,mon:n(e.mon),tar:n(e.tar)};
}
function ncmp(c){
  if(!c||typeof c!=="object")return null;
  var o={crit:{mode:"exacto",tol:0,rel:60},meses:{}};
  if(c.crit&&typeof c.crit==="object"){if(CM.indexOf(c.crit.mode)>=0)o.crit.mode=c.crit.mode;var a=+c.crit.tol,b=+c.crit.rel;if(isFinite(a)&&a>=0)o.crit.tol=a;if(isFinite(b)&&b>=0)o.crit.rel=b}
  if(c.meses&&typeof c.meses==="object")Object.keys(c.meses).forEach(function(k){
    var m=c.meses[k];if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(k)||!m||typeof m!=="object"||!Array.isArray(m.emp))return;
    var r={emp:[],pag:{},obs:String(m.obs||""),tot:{mon:null},meta:{},at:String(m.at||"")};
    m.emp.forEach(function(e){var x=nrow(e);if(x)r.emp.push(x)});
    if(m.pag&&typeof m.pag==="object")TIPOS.forEach(function(t){if(m.pag[t]!=null&&hmin(m.pag[t])!=null)r.pag[t]=String(m.pag[t])});
    if(m.tot&&m.tot.mon!=null&&isFinite(+m.tot.mon))r.tot.mon=+m.tot.mon;
    if(m.meta&&typeof m.meta==="object"){r.meta.nombre=String(m.meta.nombre||"").slice(0,80);r.meta.periodo=String(m.meta.periodo||"").slice(0,60)}
    o.meses[k]=r;
  });
  return o;
}
function pcmp(){if(!store)return "mem";var s=JSON.stringify(cmp);try{localStorage.setItem(CK,s);return localStorage.getItem(CK)===s}catch(e){return false}}
function loadC(){if(!store)return;try{var s=localStorage.getItem(CK);if(s){var c=ncmp(JSON.parse(s));if(c)cmp=c}}catch(e){}}

/* --- Motor de comparación --- */
function cabs(f,t){var p=f.split("-");return Date.UTC(+p[0],+p[1]-1,+p[2])/60000+(+t.slice(0,2))*60+(+t.slice(3))}
function emin(e){return e.rec!=null?e.rec:(e.ini&&e.fin?Math.max(0,mins(e.ini,e.fin)-(e.des||0)):null)}
function score(p,e){
  var ps=cabs(p.f,p.ini),pe=ps+mins(p.ini,p.fin);
  if(e.ini&&e.fin){var es=cabs(e.f,e.ini),ee=es+mins(e.ini,e.fin),o=Math.min(pe,ee)-Math.max(ps,es);return o>0?o+(p.f===e.f?0.5:0):0}
  return p.f===e.f?0.25:0;
}
function comparar(P,E){
  var cand=[],i,j,up={},ue={},mp=[],L=[],c=cmp.crit;
  for(i=0;i<P.length;i++)for(j=0;j<E.length;j++){var s=score(P[i],E[j]);if(s>0)cand.push([s,i,j])}
  cand.sort(function(a,b){return b[0]-a[0]});
  cand.forEach(function(x){if(up[x[1]]||ue[x[2]])return;up[x[1]]=1;ue[x[2]]=1;mp.push([x[1],x[2]])});
  mp.forEach(function(x){L.push(fila(P[x[0]],E[x[1]],c))});
  P.forEach(function(p,k){if(!up[k])L.push(fila(p,null,c))});
  E.forEach(function(e,k){if(!ue[k])L.push(fila(null,e,c))});
  L.sort(function(a,b){var ka=(a.p?a.p.f+a.p.ini:a.e.f+(a.e.ini||"")),kb=(b.p?b.p.f+b.p.ini:b.e.f+(b.e.ini||""));return ka<kb?-1:ka>kb?1:0});
  return L;
}
function fila(p,e,c){
  var x={p:p,e:e,pm:p?mins(p.ini,p.fin):null,em:e?emin(e):null,rc:p?monto(p):null,ri:e?e.mon:null,dm:null,dd:null,st:"g",why:""};
  if(!p){x.st="r";x.why="Falta en mi registro";return x}
  if(!e){x.st="r";x.why="Falta en el registro del empleador";return x}
  var y=false,r=false,w=[];
  if(x.em==null){y=true;w.push("Sin horas informadas")}else{x.dm=x.pm-x.em;if(Math.abs(x.dm)>=c.rel&&c.rel>0){r=true;w.push("Diferencia de horas")}else if(Math.abs(x.dm)>c.tol){y=true;w.push("Diferencia de minutos")}}
  if(e.ini&&e.fin){var ps=cabs(p.f,p.ini),es=cabs(e.f,e.ini),sd=Math.max(Math.abs(ps-es),Math.abs((ps+x.pm)-(es+mins(e.ini,e.fin))));if(sd>c.tol){y=true;w.push("Horario distinto")}}
  if(x.ri!=null){x.dd=x.rc-x.ri;var a=Math.abs(x.dd);if(a>0.05*x.rc&&a>=1000){r=true;w.push("Diferencia de pago")}else if(a>Math.max(1,0.005*x.rc)){y=true;w.push("Diferencia de pago")}}
  x.st=r?"r":y?"y":"g";x.why=w.join(", ");return x;
}
function resumen(L,m){
  var G={},R={pm:0,em:0,pag:0,dif:0,val:0,calc:0,inf:null,dd:null,faltaE:0,faltaP:0,missMin:0,manual:false,obs:[]},any=false;
  TIPOS.forEach(function(t){G[t]={pm:0,em:0,et:0,mon:0,pag:0,rate:null,dif:0,val:null,man:false}});
  L.forEach(function(x){
    var g=G[x.p?x.p.tipo:"sin"];
    if(x.p){g.pm+=x.pm;g.mon+=x.rc;R.calc+=x.rc}
    if(x.e&&x.em!=null){g.em+=x.em;g.et+=Math.floor(x.em/60)*60}
    if(x.e&&x.e.mon!=null){R.inf=(R.inf||0)+x.e.mon;any=true}
    if(x.p&&!x.e){R.faltaE++;R.missMin+=x.pm}
    if(x.e&&!x.p)R.faltaP++;
  });
  if(!any&&m.tot&&m.tot.mon!=null)R.inf=m.tot.mon;
  var md=cmp.crit.mode;
  TIPOS.forEach(function(t){
    var g=G[t],ov=m.pag&&m.pag[t]!=null?hmin(m.pag[t]):null;
    if(ov!=null){g.pag=ov;g.man=true;R.manual=true}
    else g.pag=md==="hora_mes"?Math.floor(g.em/60)*60:md==="hora_turno"?g.et:md==="redondeo_mes"?Math.round(g.em/60)*60:g.em;
    g.dif=g.pm-g.pag;g.rate=g.pm>0?g.mon/(g.pm/60):null;g.val=g.rate!=null?g.dif/60*g.rate:null;
    R.pm+=g.pm;R.em+=g.em;R.pag+=g.pag;if(g.val!=null)R.val+=g.val;
  });
  R.dif=R.pm-R.pag;R.G=G;if(R.inf!=null)R.dd=R.calc-R.inf;
  if(R.faltaE)R.obs.push(R.faltaE+" turno(s) míos no aparecen en el registro del empleador ("+DUR(R.missMin)+").");
  if(R.faltaP)R.obs.push(R.faltaP+" registro(s) del empleador no tienen turno mío.");
  return R;
}

      body:L.map(function(x){return [stt[x.st],fdmy(x.p?x.p.f:x.e.f),x.p?x.p.ini+" - "+x.p.fin:"-",x.e&&x.e.ini&&x.e.fin?x.e.ini+" - "+x.e.fin:"-",x.pm!=null?DUR(x.pm):"-",x.em!=null?DUR(x.em):"-",x.dm!=null?SG(x.dm):"-",x.rc!=null?money(x.rc):"-",x.ri!=null?money(x.ri):"-",x.dd!=null?SM(x.dd):"-",x.why]}),
      didParseCell:function(d){if(d.section==="body"&&d.column.index===0){var s=L[d.row.index].st;d.cell.styles.fillColor=s==="g"?[198,240,222]:s==="y"?[253,236,180]:[255,205,200]}}});
    var rows=[["Total de horas personales",DUR(R.pm)],["Total de horas reconocidas",DUR(R.em)],["Total de horas remuneradas",DUR(R.pag)+(R.manual?" (incluye valores ingresados)":"")],["Minutos de diferencia (registradas - remuneradas)",SG(R.dif)],["Valor proporcional de la diferencia",SM(R.val)],
      ["Remuneración calculada",money(R.calc)],["Remuneración informada",R.inf!=null?money(R.inf):"-"],["Diferencia monetaria",R.dd!=null?SM(R.dd):"-"],["Turnos faltantes",String(R.faltaE+R.faltaP)],["Criterio de pago del empleador",CMT[cmp.crit.mode]]];
    if(m.obs)rows.push(["Observaciones",m.obs]);R.obs.forEach(function(o){rows.push(["Nota",o])});
    var y=doc.lastAutoTable.finalY+6;if(y>doc.internal.pageSize.getHeight()-70){doc.addPage();y=18}
    doc.autoTable({startY:y,theme:"grid",body:rows,styles:{fontSize:9,cellPadding:1.8},columnStyles:{0:{fontStyle:"bold",cellWidth:90}},margin:{left:14,right:14,bottom:14}});
    doc.setFontSize(8);doc.setTextColor(110);var yy=doc.lastAutoTable.finalY+5;if(yy<doc.internal.pageSize.getHeight()-14)doc.text("Comparación matemática entre tu registro personal y el documento del empleador; una diferencia no implica por sí sola un error ni una deuda.",14,yy);
    pdfFoot(doc);
    entregar(doc.output("blob"),"Comparacion_"+ym+".pdf","c-out","c-msg");
  }catch(e){cm((e&&e.message)||"No se pudo generar el informe.")}
}

document.addEventListener("click",function(e){
  var b=e.target.closest?e.target.closest("[data-act],[data-v]"):null;if(!b)return;
  if(b.hasAttribute("data-v")){view=b.getAttribute("data-v");pend=null;render();return}
  var a=b.getAttribute("data-act"),id=b.getAttribute("data-id");
  if(a==="day"){sel=b.getAttribute("data-d");render()}
  else if(a==="addday")openSheet(null,sel);
  else if(a==="ed")openSheet(id);
  else if(a==="del"){
    if(pend===id){var bk=JSON.stringify(db);db.turnos=db.turnos.filter(function(t){return t.id!==id});pend=null;if(persist()===false){db=JSON.parse(bk);toast("No se pudo eliminar.")}else toast("Turno eliminado.");render()}
    else{pend=id;render();setTimeout(function(){if(pend===id){pend=null;render()}},3500)}
  }
  else if(a==="cfg")saveCfg();else if(a==="exp")exportar();else if(a==="imp")importar();
});
$("fab").addEventListener("click",function(){openSheet(null)});
$("f-save").addEventListener("click",saveTurno);

["f-ini","f-fin","f-pago","f-valor"].forEach(function(i){$(i).addEventListener("input",info);$(i).addEventListener("change",info)});

$("next").addEventListener("click",function(){var y=+ym.slice(0,4),m=+ym.slice(5)+1;ym=m>12?(y+1)+"-01":y+"-"+p2(m);sel=null;render()});
load();loadC();render();
})();
